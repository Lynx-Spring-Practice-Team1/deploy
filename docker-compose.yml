services:

  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - broker-network

  postgres-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        set -eu
        for db in orders_db wallet_db portfolio_db market_notifications_db price_history_db bot_db; do
          if ! psql -h postgres -d "$${POSTGRES_DB}" -tAc "SELECT 1 FROM pg_database WHERE datname='$${db}'" | grep -q 1; then
            psql -h postgres -d "$${POSTGRES_DB}" -c "CREATE DATABASE \"$${db}\""
          fi
        done
    networks:
      - broker-network
    restart: "no"

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${REDPANDA_KAFKA_EXTERNAL_PORT:-19093}
    ports:
      - "127.0.0.1:${REDPANDA_KAFKA_PORT:-9093}:9092"
      - "127.0.0.1:${REDPANDA_KAFKA_EXTERNAL_PORT:-19093}:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - broker-network

  redpanda-init:
    image: redpandadata/redpanda:latest
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -ec
      - |
        rpk --brokers redpanda:9092 topic create \
          order.created order.accepted order.rejected order.cancelled order.filled \
          market.price.updated portfolio.updated notification.created \
          --if-not-exists
    networks:
      - broker-network
    restart: "no"

  redpanda-console:
    image: redpandadata/console:latest
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:${REDPANDA_CONSOLE_PORT:-8090}:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - broker-network

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - broker-network

  # ---------------------------------------------------------------------------
  # APPLICATION SERVICES
  # Parent layout expected:
  #   parent/
  #     deploy/
  #     API-gateway/
  #     auth-service/
  #     order-service/
  #     wallet-service/
  #     portfolio-service/
  #     market-notifications/
  #     admin-service/
  #     price-history-service/
  #     frontend/
  # ---------------------------------------------------------------------------

  api-gateway:
    image: ghcr.io/lynx-spring-practice-team1/api-gateway:latest
    ports:
      - "${API_GATEWAY_PORT:-8000}:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8000
      ORDER_SERVICE_URL: http://order-service:8002
      WALLET_SERVICE_URL: http://wallet-service:8003
      PORTFOLIO_SERVICE_URL: http://portfolio-service:8004
      MARKET_NOTIFICATIONS_URL: http://market-notifications:8005
      PRICE_HISTORY_SERVICE_URL: http://price-history-service:3001
      BOT_SERVICE_URL: http://bot-service:8000
      ADMIN_SERVICE_URL: http://admin-service:8006
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      - auth-service
      - order-service
      - wallet-service
      - portfolio-service
      - market-notifications
      - price-history-service
      - admin-service
      - redis
    networks:
      - broker-network
    restart: unless-stopped

  auth-service:
    image: ghcr.io/lynx-spring-practice-team1/auth-service:latest
    ports:
      - "127.0.0.1:${AUTH_SERVICE_PORT:-8001}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    networks:
      - broker-network
    restart: unless-stopped

  order-service:
    image: ghcr.io/lynx-spring-practice-team1/order-service:latest
    ports:
      - "127.0.0.1:${ORDER_SERVICE_PORT:-8002}:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/orders_db
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      EXCHANGE_API_BASE_URL: ${EXCHANGE_API_BASE_URL}
      EXCHANGE_WS_URL: ${EXCHANGE_WS_URL}
      EXCHANGE_API_KEY: ${EXCHANGE_API_KEY}
      EXCHANGE_API_SECRET: ${EXCHANGE_API_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      WALLET_SERVICE_URL: http://wallet-service:8003
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      wallet-service:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - broker-network
    restart: unless-stopped

  wallet-service:
    image: ghcr.io/lynx-spring-practice-team1/wallet-service:latest
    ports:
      - "127.0.0.1:${WALLET_SERVICE_PORT:-8003}:8003"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/wallet_db
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    networks:
      - broker-network
    restart: unless-stopped

  portfolio-service:
    image: ghcr.io/lynx-spring-practice-team1/portfolio-service:latest
    ports:
      - "127.0.0.1:${PORTFOLIO_SERVICE_PORT:-8004}:8004"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/portfolio_db
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      WALLET_SERVICE_URL: http://wallet-service:8003
      MARKET_WS_ENABLED: "true"
      MARKET_WS_URL: ${EXCHANGE_WS_URL}
      MARKET_WS_API_KEY: ${EXCHANGE_API_KEY}
      MARKET_WS_API_SECRET: ${EXCHANGE_API_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      wallet-service:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - broker-network
    restart: unless-stopped

  market-notifications:
    image: ghcr.io/lynx-spring-practice-team1/market-notifications:latest
    ports:
      - "127.0.0.1:${MARKET_NOTIFICATIONS_PORT:-8005}:8005"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/market_notifications_db
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      EXCHANGE_WS_URL: ${EXCHANGE_WS_URL}
      EXCHANGE_WS_API_KEY: ${EXCHANGE_API_KEY}
      EXCHANGE_WS_API_SECRET: ${EXCHANGE_API_SECRET}
      PRICE_FEED_ALL_TICKERS: ${PRICE_FEED_ALL_TICKERS:-false}
      MARKET_WS_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - broker-network
    restart: unless-stopped

  price-history-service:
    image: ghcr.io/lynx-spring-practice-team1/price-history-service:latest
    ports:
      - "127.0.0.1:${PRICE_HISTORY_SERVICE_PORT:-3001}:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/price_history_db
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    networks:
      - broker-network
    restart: unless-stopped

  admin-service:
    build:
      context: ../admin-service
      dockerfile: Dockerfile
    image: broker-admin-service:local
    ports:
      - "127.0.0.1:${ADMIN_SERVICE_PORT:-8006}:8006"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      AUTH_SERVICE_URL: http://auth-service:8000
      ORDER_SERVICE_URL: http://order-service:8002
      WALLET_SERVICE_URL: http://wallet-service:8003
      PORTFOLIO_SERVICE_URL: http://portfolio-service:8004
      MARKET_NOTIFICATIONS_URL: http://market-notifications:8005
    depends_on:
      - auth-service
      - order-service
      - wallet-service
      - portfolio-service
      - market-notifications
    networks:
      - broker-network
    restart: unless-stopped

  bot-service:
    image: ghcr.io/lynx-spring-practice-team1/bot-service:latest
    ports:
      - "127.0.0.1:${BOT_SERVICE_PORT:-8007}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/bot_db
      JWT_SECRET: ${JWT_SECRET}
      BROKER_API_URL: http://api-gateway:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      api-gateway:
        condition: service_started
    networks:
      - broker-network
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: broker-frontend:local
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api-gateway
    networks:
      - broker-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  broker-network:
    driver: bridge
